name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (CLAUDE.md §8). CI only reads the repo; nothing here writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Lint, validate, build
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not floating tags (CLAUDE.md §8).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate gym data
        run: npm run validate:data

      - name: Build
        run: npm run build

      # Catches CSP violations that only fail in production. public/_headers
      # is a Cloudflare Pages feature and is NOT applied by astro dev or
      # preview, so an inlined script passes every local check and is then
      # refused by the browser on the deployed site.
      - name: Check build output against the CSP
        run: npm run check:csp

      # Search regression tests, run against the built HTML so they exercise
      # the attributes that actually ship.
      - name: Check search behaviour
        run: npm run check:search

      # Executes the real bundled client script against the real built HTML in
      # jsdom. Static markup inspection cannot catch client-behaviour bugs, and
      # two shipped in a row before this existed.
      - name: Check tab-aware rendering
        run: npm run check:tabs

      - name: Check map build
        run: npm run check:map

      # §8: build fails on high-severity vulnerabilities.
      - name: npm audit
        run: npm audit --audit-level=high

  scrapers:
    name: Scraper audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit

      # requirements.txt appears at build-order step 6. Until then the
      # scrapers are stdlib-only, so there is nothing to audit and skipping
      # is honest rather than a silent pass.
      - name: pip-audit
        run: |
          if [ -f scrapers/requirements.txt ]; then
            pip-audit --strict --requirement scrapers/requirements.txt
          else
            echo "No scrapers/requirements.txt yet — scrapers are stdlib-only. Skipping."
          fi

      - name: Byte-compile scrapers
        run: python -m compileall -q scrapers
